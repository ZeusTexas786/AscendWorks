name: Watch ServiceNow releases

on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  scan-official-feeds:
    runs-on: ubuntu-latest
    steps:
      - name: Check out website
        uses: actions/checkout@v4

      - name: Scan official product feeds
        id: scan
        continue-on-error: true
        run: python scripts/monitor_release_feeds.py > release-candidates.json

      - name: Open a review issue for new announcements
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const result = JSON.parse(fs.readFileSync('release-candidates.json', 'utf8'));
            const { owner, repo } = context.repo;

            for (const error of result.errors) {
              core.warning(`Release feed could not be checked: ${error}`);
            }

            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, state: 'all', per_page: 100
            });
            const feedAlertTitle = '[Release watch] Official feed check failed';
            const openFeedAlert = issues.find(issue =>
              !issue.pull_request && issue.state === 'open' && issue.title === feedAlertTitle
            );

            if (result.errors.length && !openFeedAlert) {
              await github.rest.issues.create({
                owner,
                repo,
                title: feedAlertTitle,
                body: [
                  'The scheduled release watcher could not read one or more configured official RSS feeds.',
                  '',
                  ...result.errors.map(error => `- ${error}`),
                  '',
                  'Update `scripts/monitor_release_feeds.py` to use a verified, public ServiceNow/Moveworks RSS feed or official API. Do not replace this with page scraping or an unlicensed aggregator. Then re-run **Watch ServiceNow releases** from GitHub Actions.',
                  '',
                  'The monitor does not update or deploy website content.'
                ].join('\n')
              });
            } else if (!result.errors.length && openFeedAlert) {
              await github.rest.issues.update({
                owner,
                repo,
                issue_number: openFeedAlert.number,
                state: 'closed',
                state_reason: 'completed'
              });
            }

            const seen = new Set(
              issues
                .filter(issue => !issue.pull_request)
                .flatMap(issue => [...(issue.body || '').matchAll(/https?:\/\/[^\s)]+/g)])
                .map(match => match[0].replace(/[.,;]+$/, ''))
            );

            for (const item of result.candidates) {
              if (seen.has(item.url)) continue;
              const title = `[Release watch] ${item.title}`.slice(0, 240);
              const body = [
                `## Official source: ${item.source}`,
                '',
                `**Published:** ${item.date || 'Date not supplied by feed'}`,
                `**Announcement:** ${item.url}`,
                '',
                '## Editorial review',
                item.summary || 'Review the official announcement and documentation before drafting.',
                '',
                '- [ ] Verify availability, prerequisites, and product naming in current official documentation',
                '- [ ] Identify the affected AscendWorks service/page and practical enterprise implication',
                '- [ ] Ask the **ServiceNow Release Monitor** agent to prepare a source-backed website update and pull request',
                '- [ ] Human review; do not publish until approved and built for IONOS',
                '',
                '_Generated by the scheduled official-feed monitor. No site content is changed or deployed automatically._'
              ].join('\n');
              await github.rest.issues.create({ owner, repo, title, body });
              seen.add(item.url);
            }
